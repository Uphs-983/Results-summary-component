<!DOCTYPe html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>Results summary component</title>
  </head>
  <body>
    <div class="container">
      <div class="profile-card-blue">
        <p class="result">Your Result</p>
        
        <div class="circle">
          <span class="Ratio">76</span>
          <span class="Percenteage">of 100</span>
        </div>
        
        <p class="Great">Great</p>
        <p class="scor">You scored higher than 65% of the people who have taken these tests.</p>
        
      </div>
      <div 
       class="profile-card-white">
        <p class="Summary">Summary</p>
        <div class="Reaction">
          <div class="left">
            <img class="img-reaction" src="icon-reaction.svg">
            <p class="reaction-p">Reaction</p>
          </div>
          <div class="right">
            <p class="num-100"><span>80</span>/100</p>
          </div>
        </div>


        <div class="Memory
        ">
          <div class="left">
            <img class="img-Memory" src="icon-memory.svg">
            <p class="Memory-p">Memory</p>
          </div>
          <div class="right">
            <p class="num-100"><span>92</span>/100</p>
          </div>
        </div>
      
        <div class="Verbal">
          <div class="left">
            <img class="img-Verbal" src="icon-verbal.svg">
            <p class="Verbal-p">Verbal</p>
          </div>
          <div class="right">
            <p class="num-100"><span>61</span>/100</p>
          </div>
        </div>
        




        <div class="Visual">
          <div class="left">
            <img class="img-Visual" src="icon-visual.svg">
            <p class="Visual-p">Visual</p>
          </div>
          <div class="right">
            <p class="num-100"><span>73</span>/100</p>
          </div>
        </div>

        <button>Continue</button>
      </div>
    </div>
  </body>
</html>
